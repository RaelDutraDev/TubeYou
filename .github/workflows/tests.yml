name: Testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar FFmpeg e FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependências Python
        run: python -m pip install -r backend/requirements.txt
      - name: Verificar dependências
        run: python -m pip check
      - name: Testar backend sem acessar o YouTube
        run: python -B -m unittest discover -s backend -p 'test_*.py' -v
      - name: Testar interface
        run: node --test tests/frontend.test.cjs
