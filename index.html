<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TubeYou</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="head">

        <h1 class="titulo">
            TubeYou
        </h1>

    </div>


    <div class="meio">

        <div class="area-principal">


            <!-- INPUT -->

            <input
                id="linkyoutube"
                type="text"
                placeholder="Cole o link do YouTube aqui..."
            >


            <!-- MENSAGEM DE ERRO -->

            <p id="mensagemErro">
                Insira um link do YouTube válido
            </p>


            <!-- ÁUDIO E VÍDEO -->

            <div id="opcoes" class="opcoes">

                <button
                    id="botaoAudio"
                    class="botao_opcao"
                >
                    ÁUDIO
                </button>


                <button
                    id="botaoVideo"
                    class="botao_opcao"
                >
                    VÍDEO
                </button>

            </div>


            <!-- ENVIAR -->

            <button
                id="botaoEnviar"
                class="botao_enviar inativo"
            >
                ENVIAR
            </button>


            <!-- FORMATOS / QUALIDADES -->

            <div
                id="opcoesFormato"
                class="opcoes_formato"
            >
            </div>


            <!-- VOLTAR -->

            <button
                id="botaoVoltar"
                class="botao_voltar"
            >
                VOLTAR
            </button>


        </div>

    </div>


    <script src="script.js?v=7823964326be"></script>

</body>

</html>
